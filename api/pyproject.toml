[project]
name = "microsandbox-demo"
version = "0.2.0"
description = "Preview AI agents inside microsandbox microVMs via FastAPI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=4.0.0",
    "alembic>=1.19.1",
    "email-validator>=2.0.0",
    "fastapi>=0.139.2",
    "greenlet>=3.3.0",
    "httpx>=0.28.0",
    "microsandbox>=0.6.6",
    "passlib[argon2]>=1.7.4",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
local = [
    "watchfiles>=1.0.0",
]
production = [
    "gunicorn>=23.0.0",
    "uvicorn-worker>=0.3.0",
]

[tool.uv]
default-groups = ["local"]
