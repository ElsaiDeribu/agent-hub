services:
  api:
    build:
      context: .
      dockerfile: compose/Dockerfile
      additional_contexts:
        registry: ../registry
    image: microsandbox-demo:latest
    ports:
      - "8000:8000"
    # microsandbox launches hardware-isolated microVMs, which requires KVM.
    # This works only on a Linux host that exposes /dev/kvm (bare metal or a
    # VM with nested virtualization enabled). It will NOT work under Docker
    # Desktop on Windows/macOS, where /dev/kvm is not available.
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    command: /app/compose/start
    env_file:
      - .env
    depends_on:
      - postgres
    # Persist pulled OCI images / runtime state so cold starts stay fast.
    volumes:
      - microsandbox_data:/root/.microsandbox
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
      POSTGRES_DB: agenthub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  microsandbox_data:
  postgres_data:
